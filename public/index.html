<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Proxy Window</title>
  <script src="/baremux/index.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #131d21; color: #fff; }
    .toolbar {
      display: flex; gap: 8px; padding: 10px 14px;
      background: #1a272c; border-bottom: 1px solid #2b3d44;
    }
    input {
      flex: 1; padding: 8px 12px; border-radius: 6px;
      border: 1px solid #2b3d44; background: #0f171a; color: #fff; font-size: 14px;
    }
    button {
      padding: 8px 16px; border: none; border-radius: 6px;
      background: #2ecc71; color: #0f171a; font-weight: 600; cursor: pointer;
    }
    #status {
      padding: 6px 14px; font-size: 12px; background: #0f171a;
      color: #a3b8c2; border-bottom: 1px solid #2b3d44;
    }
    iframe { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
  <form class="toolbar" id="proxyForm">
    <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://tiktok.com)" required />
    <button type="submit">Go</button>
  </form>
  <div id="status">Ready.</div>
  <iframe id="viewport"></iframe>

  <script>
    const statusEl = document.getElementById('status');
    function logStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.style.color = isError ? '#ff6b6b' : '#2ecc71';
    }

    window.addEventListener('error', (e) => logStatus('Page Error: ' + e.message, true));
    window.addEventListener('unhandledrejection', (e) => logStatus('Promise Error: ' + (e.reason?.message || e.reason), true));

    document.getElementById('proxyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        if (!('serviceWorker' in navigator)) {
          throw new Error('Service Workers are blocked or unsupported in this browser.');
        }
        if (typeof BareMux === 'undefined') {
          throw new Error('BareMux script failed to load (/baremux/index.js).');
        }
        if (typeof __uv$config === 'undefined') {
          throw new Error('Ultraviolet config failed to load (/uv/uv.config.js).');
        }

        logStatus('1/3 Registering Service Worker...');
        await navigator.serviceWorker.register('/uv/sw.js', { scope: __uv$config.prefix });
        await navigator.serviceWorker.ready;

        logStatus('2/3 Connecting Wisp transport...');
        const connection = new BareMux.BareMuxConnection('/baremux/worker.js');
        const wispUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/wisp/';
        await connection.setTransport('/epoxy/index.mjs', [{ wisp: wispUrl }]);

        let url = document.getElementById('urlInput').value.trim();
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }

        const encoded = __uv$config.prefix + __uv$config.encodeUrl(url);
        logStatus('3/3 Loading ' + url + ' ...');
        document.getElementById('viewport').src = encoded;
      } catch (err) {
        logStatus('Error: ' + (err.message || err), true);
      }
    });
  </script>
</body>
</html>
